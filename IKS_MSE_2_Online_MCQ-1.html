<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IKS MSE 2 — Online MCQ Quiz</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#172033;background:#f4f6fb}
*{box-sizing:border-box}body{margin:0;padding:18px}.wrap{max-width:850px;margin:auto}.top,.card{background:white;border:1px solid #e1e6ef;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 4px 18px #1720330a}
h1{font-size:clamp(1.35rem,4vw,2rem);margin:0 0 8px}.muted{color:#5d687b}.progress{height:8px;background:#e9edf5;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#315bd6;width:0%;transition:width .2s}
.qnum{font-size:.9rem;color:#315bd6;font-weight:700}.question{font-size:1.1rem;font-weight:650;margin:10px 0 16px}.option{display:flex;gap:10px;align-items:flex-start;border:1px solid #dce2ed;border-radius:10px;padding:12px;margin:9px 0;cursor:pointer}.option:hover{background:#f7f9ff}.option input{margin-top:4px;accent-color:#315bd6}.option.selected{border-color:#315bd6;background:#f1f5ff}
button{border:0;border-radius:10px;padding:12px 17px;font-weight:650;cursor:pointer;font-size:1rem}.primary{background:#315bd6;color:white}.secondary{background:#e9edf5;color:#172033}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:18px}.result{font-size:1.15rem;font-weight:700}.review{border-top:1px solid #e1e6ef;padding:12px 0}.correct{color:#18794e}.wrong{color:#b42318}.hidden{display:none}.small{font-size:.9rem}
</style></head><body><main class="wrap">
<section class="top"><h1>IKS MSE 2 — Online MCQ Quiz</h1><div class="muted">50 questions · Choose one answer for each question · Your score appears when you submit.</div><div class="progress"><div id="bar" class="bar"></div></div><div id="status" class="small muted">Question 1 of 50</div></section>
<section id="quiz" class="card"><div id="qnum" class="qnum"></div><div id="question" class="question"></div><div id="options"></div><div class="actions"><button id="prev" class="secondary">Previous</button><button id="next" class="primary">Next</button><button id="submit" class="primary hidden">Submit quiz</button></div></section>
<section id="results" class="card hidden"><div class="result" id="score"></div><p id="summary" class="muted"></p><button id="reviewBtn" class="primary">Review answers</button> <button id="restart" class="secondary">Try again</button><div id="review" class="hidden"></div></section>
</main>
<script>
const questions = [["The word “Veda” is derived from the Sanskrit root “vid,” meaning:", ["To know", "To worship", "To sacrifice", "To write"], 0], ["The Rigveda primarily consists of:", ["Hymns praising natural and cosmic forces", "Musical compositions", "Legal codes", "Historical narratives"], 0], ["The Atharvaveda mainly deals with:", ["Healing and practical aspects of life", "War strategies", "Royal administration", "Temple architecture"], 0], ["The Upanishads primarily emphasize:", ["Philosophical inquiry and self-knowledge", "Temple construction", "Ritual sacrifice", "Political governance"], 0], ["The Puranas belong to which category of texts?", ["Smriti", "Shruti", "Vedanga", "Upaveda"], 0], ["Traditionally, how many major Puranas are there?", ["18", "12", "10", "4"], 0], ["The Ramayana is traditionally attributed to:", ["Valmiki", "Vyasa", "Kalidasa", "Panini"], 0], ["The Mahabharata presents dharma as:", ["Situational and complex", "Fixed and unchanging", "Always simple and clear", "Unimportant"], 0], ["Karma Yoga, Bhakti Yoga, and Jnana Yoga are explained in the:", ["Bhagavad Gita", "Vedas", "Puranas", "Aranyakas"], 0], ["The transition from Vedic ritual to Upanishadic philosophy marks a movement from:", ["External ritual to internal introspection", "Polytheism to atheism", "War to peace", "Myth to science"], 0], ["Which historical period is Kalidasa generally associated with?", ["Gupta Period", "Mauryan Period", "Mughal Period", "Vedic Period"], 0], ["Which of the following is a famous drama written by Kalidasa?", ["Abhijnanasakuntalam", "Kadambari", "Harshacharita", "Hitopadesha"], 0], ["Banabhatta served in the court of which ruler?", ["Harshavardhana", "Chandragupta Maurya", "Ashoka", "Krishnadevaraya"], 0], ["Harshacharita is an example of:", ["Historical prose", "Dramatic poetry", "Devotional hymn", "Epic narrative"], 0], ["The Tirukkural was composed by:", ["Thiruvalluvar", "Banabhatta", "Kalidasa", "Narayana"], 0], ["The three sections of the Tirukkural are Aram, Porul, and:", ["Inbam", "Dharma", "Moksha", "Satya"], 0], ["The Panchatantra primarily aims to teach:", ["Political wisdom and diplomacy", "Ritual practices", "Astronomical knowledge", "Medical science"], 0], ["The Jataka tales narrate:", ["Previous lives of the Buddha", "Stories of Hindu kings", "Greek legends", "Jain Tirthankaras"], 0], ["The Ajanta cave murals are inspired by:", ["Jataka tales", "Tirukkural couplets", "Panchatantra stories", "Raghuvamsa"], 0], ["A major literary feature common to Panchatantra and Hitopadesha is:", ["Animal fables conveying moral lessons", "Historical narration", "Use of epic similes", "Strict religious doctrine"], 0], ["The Dravidian language family is generally divided into how many branches?", ["Four", "Two", "Three", "Five"], 0], ["Telugu belongs to which branch of the Dravidian language family?", ["South-Central Dravidian", "Northern Dravidian", "Central Dravidian", "Southern Dravidian"], 0], ["Which branch do Tamil, Kannada, and Malayalam belong to?", ["Southern", "Northern", "Central", "South-Central"], 0], ["The Sangam period of Tamil literature is approximately dated between:", ["300 BCE–300 CE", "1000–500 BCE", "600–900 CE", "1200–1500 CE"], 0], ["Sangam literature is divided into two main themes: Akam and:", ["Puram", "Bhakti", "Champu", "Vachana"], 0], ["The earliest known Kannada inscription is the:", ["Halmidi inscription", "Ashokan Edict", "Erragudipadu inscription", "Pattadakal inscription"], 0], ["Vachana literature in Kannada is associated with which movement?", ["Lingayat (Sharan movement)", "Bhakti", "Sangam", "Jain reform"], 0], ["Malayalam emerged as a distinct language around:", ["9th century CE", "5th century CE", "3rd century BCE", "15th century CE"], 0], ["The literary style that blends Tamil and Sanskrit in Malayalam is called:", ["Manipravalam", "Vachana", "Champu", "Prabandha"], 0], ["A common feature shared by Dravidian languages is:", ["Agglutinative morphology and retroflex consonants", "Absence of verb conjugation", "Use of Roman script", "Lack of literary tradition"], 0], ["Ethical and value-based knowledge in Indian traditions is primarily derived from:", ["Sacred texts and cultural narratives", "Political documents", "Trade manuals", "Foreign accounts"], 0], ["Which of the following is a foundational Hindu sacred text mentioned in the unit?", ["Bhagavad-Gita", "Lotus Sutra", "Zend Avesta", "Tripitaka"], 0], ["The concept of interconnectedness in Hindu thought is symbolized in the myth of:", ["Purusha", "Rama", "Arjuna", "Buddha"], 0], ["The doctrine that actions produce corresponding consequences across lifetimes is known as:", ["Karma", "Dharma", "Moksha", "Nirvana"], 0], ["The four stages of life described in the Laws of Manu include student, householder, forest dweller, and:", ["Renunciant", "Warrior", "Merchant", "King"], 0], ["The ultimate goal in Buddhism is:", ["Enlightenment and Nirvana", "Heaven", "Salvation through sacrifice", "Material prosperity"], 0], ["The Noble Eightfold Path includes all of the following EXCEPT:", ["Right inheritance", "Right speech", "Right livelihood", "Right mindfulness"], 0], ["The Five Precepts in Buddhism include abstaining from:", ["Killing and false speech", "Eating meat", "Marriage", "Travel"], 0], ["Buddhism rejects the idea of a permanent:", ["Self (Atman)", "Moral law", "Community", "Discipline"], 0], ["Ethical knowledge in sacred traditions is primarily intended to:", ["Transform character and promote harmony", "Preserve political power", "Provide entertainment", "Encourage isolation"], 0], ["Two major urban centers of the Indus Valley Civilization were:", ["Harappa and Mohenjo-daro", "Pataliputra and Taxila", "Ujjain and Mathura", "Lothal and Varanasi"], 0], ["Most Indus seals were made from:", ["Steatite", "Marble", "Bronze", "Terracotta"], 0], ["Indus seals were primarily used for:", ["Marking ownership and trade goods", "Religious sacrifices", "Royal decoration", "Temple rituals only"], 0], ["The most frequently depicted animal motif on Indus seals is:", ["Humped bull", "Elephant", "Tiger", "Horse"], 0], ["The so-called “unicorn” motif in Indus art is:", ["A mythical or symbolic figure", "A known zoological species", "A foreign import", "A royal emblem only"], 0], ["The famous “Priest-King” sculpture was discovered at:", ["Mohenjo-daro", "Harappa", "Lothal", "Dholavira"], 0], ["Female terracotta figurines are often interpreted as symbols of:", ["Fertility", "Warfare", "Trade", "Royal authority"], 0], ["The absence of large temples in Indus cities suggests that art was:", ["Integrated into daily life", "Limited to royal courts", "Completely absent", "Controlled by priests only"], 0], ["The seated yogic figure on some seals is often interpreted as a proto-form of:", ["Shiva (Pashupati)", "Indra", "Vishnu", "Buddha"], 0], ["Indus artifacts indicate a society that emphasized:", ["Economic integration and symbolic communication", "Monumental royal propaganda", "Nomadic culture", "Complete isolation"], 0]];
let index=0, answers=Array(questions.length).fill(null), submitted=false;
function shuffleQuiz(){
 // Shuffle choices while keeping each correct answer attached to its text.
 questions.forEach(q=>{const correctText=q[1][q[2]];for(let i=q[1].length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[1][i],q[1][j]]=[q[1][j],q[1][i]];}q[2]=q[1].indexOf(correctText);});
 // Shuffle question order too.
 for(let i=questions.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]];}
}
shuffleQuiz();
const $=id=>document.getElementById(id);
function render(){
 const [q,opts]=[questions[index][0],questions[index][1]];
 $('qnum').textContent=`QUESTION ${index+1}`;
 $('question').textContent=q; $('options').innerHTML='';
 opts.forEach((opt,i)=>{const label=document.createElement('label');label.className='option'+(answers[index]===i?' selected':'');
 label.innerHTML=`<input type="radio" name="answer" ${answers[index]===i?'checked':''}> <span><b>${String.fromCharCode(65+i)}.</b> ${opt}</span>`;
 label.addEventListener('click',()=>{answers[index]=i;render()});$('options').appendChild(label)});
 $('prev').disabled=index===0; $('prev').style.opacity=index===0?.45:1;
 $('next').classList.toggle('hidden',index===questions.length-1);
 $('submit').classList.toggle('hidden',index!==questions.length-1);
 $('status').textContent=`Question ${index+1} of ${questions.length} · ${answers.filter(a=>a!==null).length} answered`;
 $('bar').style.width=((index+1)/questions.length*100)+'%';
}
$('prev').onclick=()=>{if(index>0){index--;render()}};
$('next').onclick=()=>{if(index<questions.length-1){index++;render()}};
$('submit').onclick=()=>{
 submitted=true;let score=0;questions.forEach((q,i)=>{if(answers[i]===q[2])score++});
 $('quiz').classList.add('hidden');$('results').classList.remove('hidden');
 $('score').textContent=`Your score: ${score} / ${questions.length} (${Math.round(score/questions.length*100)}%)`;
 $('summary').textContent=`You answered ${answers.filter(a=>a!==null).length} of ${questions.length} questions.`;
};
$('reviewBtn').onclick=()=>{
 const r=$('review');r.classList.toggle('hidden');$('reviewBtn').textContent=r.classList.contains('hidden')?'Review answers':'Hide review';
 r.innerHTML=questions.map((q,i)=>{const ok=answers[i]===q[2];return `<div class="review"><b>${i+1}. ${q[0]}</b><div class="${ok?'correct':'wrong'}">${answers[i]===null?'Not answered':(ok?'Correct: ':'Your answer: ')+q[1][answers[i]]}</div>${!ok?`<div class="correct">Correct answer: ${q[1][q[2]]}</div>`:''}</div>`}).join('');
};
$('restart').onclick=()=>{shuffleQuiz();index=0;answers=Array(questions.length).fill(null);submitted=false;$('results').classList.add('hidden');$('quiz').classList.remove('hidden');$('review').classList.add('hidden');render()};
render();
</script></body></html>
